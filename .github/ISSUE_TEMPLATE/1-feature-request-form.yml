name: Feature request
description: Propose a focused DevNotch capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Use Discussions for early ideas. Open an issue when the problem and expected behavior are concrete.
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: Describe the workflow problem without prescribing an implementation.
      placeholder: "When I run a local model, I cannot see..."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe observable behavior, failure states, and the data source.
      placeholder: "DevNotch should..."
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source and privacy boundary
      description: Required for integrations; link official documentation and state exactly what is collected.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, mockups, or screenshots.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I described the data source and failure behavior when integration is involved.
          required: true
