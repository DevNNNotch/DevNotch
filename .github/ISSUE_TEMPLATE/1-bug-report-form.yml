name: Bug report
description: Report a reproducible DevNotch defect.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, local API tokens, clipboard contents, prompts, or private source code.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe one issue with exact steps and the observed error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: DevNotch version
      options:
        - Development branch
        - Local build from main
        - Tagged release
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model and display layout
      description: Include notch/no-notch and external displays when relevant.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log output
      description: Remove credentials, prompts, paths, and source content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I removed secrets and private content from this report.
          required: true
