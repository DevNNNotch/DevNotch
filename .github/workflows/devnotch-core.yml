name: DevNotch Core

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build core
        run: swift build
      - name: Test core
        run: swift test
      - name: Smoke test local API
        run: scripts/smoke-local-api
      - name: Validate Python client
        run: |
          python3 -m py_compile Examples/devnotch_client.py
          python3 -m py_compile Examples/claude_statusline.py
          python3 -m py_compile Examples/codex_usage_sync.py
          python3 Examples/devnotch_client.py --help >/dev/null
          python3 -m unittest discover -s Tests/Python -p 'test_*.py'
      - name: Validate project files
        run: |
          plutil -lint boringNotch.xcodeproj/project.pbxproj
          plutil -lint boringNotch/Info.plist
          plutil -lint boringNotch/boringNotch.entitlements
      - name: Verify packaging
        run: |
          bash -n \
            Configuration/dmg/create_dmg.sh \
            scripts/build-local \
            scripts/build-release \
            scripts/devnotch-event \
            scripts/notarize-release \
            scripts/render-homebrew-cask \
            scripts/smoke-local-api \
            scripts/validate-version \
            scripts/verify-packaging \
            scripts/lib/macos-toolchain
          zsh -n scripts/generate-app-icon
          scripts/verify-packaging
      - name: Check whitespace
        run: git diff --check
