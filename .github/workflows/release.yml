name: Release DevNotch

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEVNOTCH_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      DEVNOTCH_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      DEVNOTCH_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      DEVNOTCH_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == "v$VERSION" && "$RELEASE_TAG" != "$VERSION" ]] || { echo "::error::Release tag must start with v: $RELEASE_TAG"; exit 1; }
          scripts/validate-version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require a commit from main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main"
            exit 1
          fi

      - name: Validate required secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_BASE64" ]] || { echo "::error::Missing secret APPLE_DEVELOPER_ID_CERTIFICATE_BASE64"; exit 1; }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || { echo "::error::Missing secret APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$KEYCHAIN_PASSWORD" ]] || { echo "::error::Missing secret APPLE_KEYCHAIN_PASSWORD"; exit 1; }
          [[ -n "$NOTARY_PRIVATE_KEY_BASE64" ]] || { echo "::error::Missing secret APPLE_NOTARY_PRIVATE_KEY_BASE64"; exit 1; }
          [[ -n "$DEVNOTCH_DEVELOPMENT_TEAM" ]] || { echo "::error::Missing secret APPLE_DEVELOPMENT_TEAM"; exit 1; }
          [[ -n "$DEVNOTCH_SIGNING_IDENTITY" ]] || { echo "::error::Missing secret APPLE_SIGNING_IDENTITY"; exit 1; }
          [[ -n "$DEVNOTCH_NOTARY_KEY_ID" ]] || { echo "::error::Missing secret APPLE_NOTARY_KEY_ID"; exit 1; }
          [[ -n "$DEVNOTCH_NOTARY_ISSUER_ID" ]] || { echo "::error::Missing secret APPLE_NOTARY_ISSUER_ID"; exit 1; }

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/devnotch-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "DEVNOTCH_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-release "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Notarize and verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/notarize-release "dist/DevNotch-$VERSION.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp "dist/DevNotch-$VERSION.dmg.sha256" dist/SHA256SUMS
          PRERELEASE_ARGUMENT=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGUMENT+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/DevNotch-$VERSION.dmg" \
            dist/SHA256SUMS \
            --generate-notes \
            --title "DevNotch $VERSION" \
            "${PRERELEASE_ARGUMENT[@]}"

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: macos-15
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out packaging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Homebrew token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TAP_TOKEN" ]] || { echo "::error::Missing secret HOMEBREW_TAP_TOKEN"; exit 1; }

      - name: Download published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "DevNotch-$VERSION.dmg" \
            --dir "$RUNNER_TEMP/release"

      - name: Update Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          DMG_PATH="$RUNNER_TEMP/release/DevNotch-$VERSION.dmg"
          [[ -f "$DMG_PATH" ]] || { echo "::error::Published DMG was not downloaded: $DMG_PATH"; exit 1; }
          SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          gh auth setup-git
          gh repo clone "${GITHUB_REPOSITORY_OWNER}/homebrew-devnotch" "$RUNNER_TEMP/homebrew-devnotch"
          scripts/render-homebrew-cask \
            "$VERSION" \
            "$SHA256" \
            "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/homebrew-devnotch/Casks/devnotch.rb"
          ruby -c "$RUNNER_TEMP/homebrew-devnotch/Casks/devnotch.rb"
          brew style "$RUNNER_TEMP/homebrew-devnotch/Casks/devnotch.rb"
          cd "$RUNNER_TEMP/homebrew-devnotch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/devnotch.rb
          if git diff --cached --exit-code; then
            echo "Homebrew Cask already points to DevNotch $VERSION."
            exit 0
          fi
          git commit -m "Update DevNotch to $VERSION"
          git push origin HEAD:main
